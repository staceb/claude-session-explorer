<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain</title>
<link rel="stylesheet" href="/static/style.css">
<script>try { const g = new URLSearchParams(location.search).get("ground") || localStorage.getItem("ground") || "ink";
  document.documentElement.dataset.ground = g;
  if (["sun", "tangerine", "bubblegum", "lime"].includes(g)) document.documentElement.dataset.bright = ""; } catch (e) {}</script>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">Second<br>Brain<small>Everything you've done with Claude Code, on your Mac</small></div>
    <button class="tab" data-view="overview">Overview</button>
    <button class="tab" data-view="map">Map <span class="n" id="n-map"></span></button>
    <button class="tab" data-view="sessions">Sessions <span class="n" id="n-sessions"></span></button>
    <button class="tab" data-view="agents">Agents <span class="n" id="n-agents"></span></button>
    <button class="tab" data-view="installed">Installed</button>
    <button class="tab" data-view="memory">Memory <span class="n" id="n-memory"></span></button>
    <div class="navfoot">
      <button class="btn yellow" id="update">↻ Update</button>
      <div id="updstatus" style="margin-top:8px"></div>
      <div id="navnote" style="margin-top:6px"></div>
      <div class="grounds" title="Background colour"><span>Background</span>
        <button data-ground="ink" style="background:#1c1c1f" aria-label="Charcoal"></button>
        <button data-ground="navy" style="background:#1a2242" aria-label="Navy"></button>
        <button data-ground="plum" style="background:#2a1c31" aria-label="Plum"></button>
        <button data-ground="paper" style="background:#ece6d8" aria-label="Paper"></button>
        <button data-ground="sun" style="background:#ffd43b" aria-label="Sun"></button>
        <button data-ground="tangerine" style="background:#ff9b50" aria-label="Tangerine"></button>
        <button data-ground="bubblegum" style="background:#f7a8d0" aria-label="Bubblegum"></button>
        <button data-ground="lime" style="background:#9be78f" aria-label="Lime"></button></div>
    </div>
  </nav>
  <main>
    <div class="topbar"><input id="q" type="search" placeholder="Search everything you and Claude said…" autocomplete="off"></div>
    <div id="main"></div>
  </main>
</div>
<script src="/static/map.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
