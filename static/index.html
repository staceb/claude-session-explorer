<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">Second<br>Brain<small>Everything you've done with Claude Code, on your Mac</small></div>
    <button class="tab" data-view="overview">Overview</button>
    <button class="tab" data-view="map">Map <span class="n" id="n-map"></span></button>
    <button class="tab" data-view="sessions">Sessions <span class="n" id="n-sessions"></span></button>
    <button class="tab" data-view="agents">Agents <span class="n" id="n-agents"></span></button>
    <button class="tab" data-view="installed">Installed</button>
    <button class="tab" data-view="memory">Memory <span class="n" id="n-memory"></span></button>
    <div class="navfoot">
      <button class="btn yellow" id="update">↻ Update</button>
      <div id="updstatus" style="margin-top:8px"></div>
      <div id="navnote" style="margin-top:6px"></div>
    </div>
  </nav>
  <main>
    <div class="topbar"><input id="q" type="search" placeholder="Search everything you and Claude said…" autocomplete="off"></div>
    <div id="main"></div>
  </main>
</div>
<script src="/static/map.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
